<!-- Supabase → Authentication → Emails → Templates → "Change email address"
     Oggetto: Conferma il nuovo indirizzo email di RunSet -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:16px;overflow:hidden;">
        <tr>
          <td style="background:#09090b;padding:24px 28px;color:#ffffff;font-size:24px;font-weight:bold;">
            RunSet<span style="color:#facc15;">.</span>
          </td>
        </tr>
        <tr>
          <td style="padding:28px;color:#18181b;font-size:15px;line-height:1.6;">
            <p style="margin:0 0 16px;font-size:20px;font-weight:bold;">Conferma il nuovo indirizzo</p>
            <p style="margin:0 0 24px;">Hai chiesto di usare <strong>{{ .NewEmail }}</strong> per il tuo account RunSet. Conferma il cambio con il pulsante qui sotto.</p>
            <p style="margin:0 0 24px;">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#facc15;color:#09090b;text-decoration:none;font-weight:bold;padding:14px 24px;border-radius:12px;">Conferma il cambio</a>
            </p>
            <p style="margin:0;color:#71717a;font-size:13px;">Se non hai chiesto tu il cambio, ignora questa email e cambia la password dell'account.</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
